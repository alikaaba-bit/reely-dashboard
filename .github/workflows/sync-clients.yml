name: Daily Google Sheets Sync

on:
  schedule:
    # Run at 9:00 AM UTC every day
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync endpoint
        run: |
          curl -X POST https://reely-dashboard-production-6bcc.up.railway.app/api/sync \
            -H "Content-Type: application/json" \
            -w "\nHTTP Status: %{http_code}\n"
